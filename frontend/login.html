<!DOCTYPE html>
<html lang="id" class="dark">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Petugas - Sistem Deteksi Gas & Api</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script>
        tailwind.config = {
            darkMode: 'class',
            theme: {
                extend: {
                    colors: {
                        darkbg: '#0f172a',
                        cardbg: '#1e293b'
                    }
                }
            }
        }
    </script>
</head>
<body class="bg-darkbg text-slate-100 min-h-screen flex items-center justify-center p-4">

    <div class="max-w-md w-full bg-cardbg rounded-2xl p-8 border border-slate-800 shadow-xl space-y-6">
        <div class="text-center">
            <span class="text-3xl">🔐</span>
            <h1 class="text-xl font-bold text-white mt-2">Login Petugas & HSE</h1>
            <p class="text-xs text-slate-400 mt-1">Akses Sistem Monitoring Kebocoran Gas ESP32</p>
        </div>

        <div id="alertBox" class="hidden p-3 rounded-lg text-xs font-medium"></div>

        <form id="loginForm" class="space-y-4">
            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Email Petugas</label>
                <input type="email" id="email" required placeholder="operator@pens.ac.id" 
                    class="w-full px-3 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-blue-500">
            </div>

            <div>
                <label class="block text-xs font-semibold uppercase text-slate-400 mb-1">Kata Sandi</label>
                <input type="password" id="password" required placeholder="••••••••" 
                    class="w-full px-3 py-2.5 rounded-lg bg-slate-900 border border-slate-700 text-white text-sm focus:outline-none focus:border-blue-500">
            </div>

            <button type="submit" class="w-full py-2.5 px-4 rounded-lg bg-blue-600 hover:bg-blue-500 font-semibold text-sm text-white transition">
                Masuk ke Dashboard
            </button>
        </form>

        <div class="text-center">
            <a href="index.html" class="text-xs text-slate-400 hover:text-white transition">← Kembali ke Dashboard Publik</a>
        </div>
    </div>

    <script>
        const form = document.getElementById('loginForm');
        const alertBox = document.getElementById('alertBox');

        form.addEventListener('submit', async (e) => {
            e.preventDefault();
            const email = document.getElementById('email').value;
            const password = document.getElementById('password').value;

            try {
                const res = await fetch('/api/v1/auth/login', {
                    method: 'POST',
                    headers: { 'Content-Type': 'application/json' },
                    body: JSON.stringify({ email, password })
                });

                const data = await res.json();
                if (res.ok) {
                    localStorage.setItem('gas_jwt_token', data.token);
                    localStorage.setItem('gas_user', JSON.stringify(data.user));
                    alertBox.className = 'p-3 rounded-lg text-xs font-medium bg-emerald-500/20 text-emerald-400 border border-emerald-500/30';
                    alertBox.innerText = 'Login berhasil! Mengalihkan ke dashboard...';
                    alertBox.classList.remove('hidden');
                    setTimeout(() => window.location.href = 'index.html', 1000);
                } else {
                    alertBox.className = 'p-3 rounded-lg text-xs font-medium bg-rose-500/20 text-rose-400 border border-rose-500/30';
                    alertBox.innerText = data.message || 'Login gagal.';
                    alertBox.classList.remove('hidden');
                }
            } catch (err) {
                alertBox.className = 'p-3 rounded-lg text-xs font-medium bg-rose-500/20 text-rose-400 border border-rose-500/30';
                alertBox.innerText = 'Tidak dapat menghubungi server backend.';
                alertBox.classList.remove('hidden');
            }
        });
    </script>
</body>
</html>
